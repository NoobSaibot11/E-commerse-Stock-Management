# Full stack:      docker compose up --build   ->  http://localhost:3000
# Database only:   docker compose up -d postgres   (for `npm run dev:*`)
#
# Startup order: postgres (healthy) -> migrate (applies migrations, seeds,
# exits) -> grpc-server (healthy) -> graphql-server (healthy) -> frontend.

x-app-env: &app-env
  DATABASE_URL: postgresql://ecommerce:ecommerce@postgres:5432/ecommerce
  # Local default for convenience. Set JWT_SECRET in your shell or a .env
  # file next to this one for anything beyond local use.
  JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-0123456789abcdef}
  JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}

services:
  postgres:
    image: postgres:17-alpine
    container_name: ecommerce-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ecommerce
      POSTGRES_DB: ecommerce
    # Host port 5433 avoids clashing with a locally installed PostgreSQL on 5432.
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce -d ecommerce"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-off job: bring the schema up to date and load demo data, then exit.
  # Both steps are safe to repeat on every `up`.
  migrate:
    build:
      context: .
      target: grpc-server
    image: ecommerce/grpc-server
    command: ["sh", "-c", "npm run db:deploy && npm run db:seed"]
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy

  grpc-server:
    # Same image as `migrate`; the second build is served from cache.
    build:
      context: .
      target: grpc-server
    image: ecommerce/grpc-server
    restart: unless-stopped
    environment:
      <<: *app-env
      PORT: "50051"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -qO- --header='Content-Type: application/json' --post-data='{}'
          http://localhost:50051/ecommerce.v1.InventoryService/GetProducts
      interval: 5s
      timeout: 5s
      retries: 10

  graphql-server:
    build:
      context: .
      target: graphql-server
    image: ecommerce/graphql-server
    restart: unless-stopped
    environment:
      PORT: "4000"
      GRPC_URL: http://grpc-server:50051
    depends_on:
      grpc-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  # nginx: serves the React build and proxies /graphql and /grpc/, so this
  # is the only app port published to the host.
  frontend:
    build:
      context: .
      target: frontend
    image: ecommerce/frontend
    restart: unless-stopped
    # Change with FRONTEND_PORT if 3000 is taken on your machine.
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      graphql-server:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, not localhost: busybox wget tries IPv6 first, and nginx
      # only listens on IPv4.
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1/"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
