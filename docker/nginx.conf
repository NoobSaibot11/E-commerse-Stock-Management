# Serves the React build and proxies API calls, so the browser talks to a
# single origin: no CORS, and only this port needs to be published.
server {
    listen 80;
    root /usr/share/nginx/html;

    # GraphQL BFF (also serves the GraphiQL IDE on GET /graphql)
    location /graphql {
        proxy_pass http://graphql-server:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # gRPC service over the Connect protocol, used directly by the browser
    # for the order-status stream. The trailing slashes strip the /grpc prefix.
    location /grpc/ {
        proxy_pass http://grpc-server:50051/;
        proxy_http_version 1.1;
        # Pass each streamed message through as it arrives instead of
        # buffering the whole response.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # Single-page app: unknown paths fall back to index.html.
    location / {
        try_files $uri /index.html;
    }
}
